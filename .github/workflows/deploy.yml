name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch: # รัน manual ได้ด้วย

jobs:
  # ===================================================
  # JOB 1: Deploy Frontend → S3 + CloudFront
  # ===================================================
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.API_URL }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Sync to S3
        run: |
          aws s3 sync ./frontend/dist s3://${{ secrets.S3_BUCKET }} \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"
          # index.html ไม่ cache เพื่อให้ได้ version ใหม่เสมอ
          aws s3 cp ./frontend/dist/index.html s3://${{ secrets.S3_BUCKET }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CF_DISTRIBUTION_ID }} \
            --paths "/*"

  # ===================================================
  # JOB 2: Deploy Backend → EC2
  # ===================================================
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: deploy-frontend # รอ frontend เสร็จก่อน

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e  # หยุดทันทีถ้า command ไหน fail

            echo "=== Pulling latest code ==="
            cd /var/www/myapp/backend
            git pull origin main

            echo "=== Installing dependencies ==="
            npm ci --only=production

            echo "=== Generating Prisma client ==="
            npx prisma generate

            echo "=== Running migrations ==="
            npx prisma migrate deploy

            echo "=== Restarting app ==="
            pm2 restart myapp-backend --update-env
            pm2 save

            echo "=== Health check ==="
            sleep 3
            curl -f http://localhost:8000/health || (pm2 logs myapp-backend --lines 50 && exit 1)

            echo "=== Deploy complete! ==="

      - name: Notify on failure
        if: failure()
        run: echo "Deploy failed! Check logs above."
        # ถ้ามี Slack/Discord webhook ใส่ notification ได้ที่นี่
